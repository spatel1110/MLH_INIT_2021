<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Architect of Cosmic Destiny — Kundali of Shubham Patel</title>
<style>
  :root{
    --noir:#070512;
    --midnight:#0b1026;
    --indigo:#141e3c;
    --purple-1:#1a0b2e;
    --purple-2:#2d1b4e;
    --purple-3:#3a2360;
    --gold:#d4af37;
    --gold-soft:#f5d76e;
    --gold-deep:#9b7d2a;
    --ink:#e9e3ff;
    --muted:#a99fce;
    --line:rgba(212,175,55,0.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--noir);color:var(--ink);font-family:"Georgia","Times New Roman",serif;-webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(58,35,96,.55), transparent 60%),
      radial-gradient(900px 700px at -10% 20%, rgba(20,30,60,.6), transparent 55%),
      radial-gradient(1000px 900px at 50% 120%, rgba(45,27,78,.5), transparent 60%),
      linear-gradient(180deg,#070512 0%,#0b1026 45%,#0a0719 100%);
    min-height:100vh;overflow-x:hidden;
  }
  /* ----- animated star layers ----- */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .star{position:absolute;border-radius:50%;background:#fff;opacity:.7;animation:twinkle ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  .shoot{position:absolute;width:2px;height:2px;background:linear-gradient(90deg,#fff,transparent);
    box-shadow:0 0 8px 2px rgba(255,255,255,.6);animation:shoot linear infinite;opacity:0}
  @keyframes shoot{0%{transform:translate(0,0) rotate(35deg);opacity:0}
    8%{opacity:1}20%{opacity:1}40%{transform:translate(420px,300px) rotate(35deg);opacity:0}100%{opacity:0}}

  .wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:34px 20px 80px}

  /* ----- header ----- */
  header{text-align:center;margin-bottom:26px}
  .eyebrow{letter-spacing:.5em;text-transform:uppercase;font-size:11px;color:var(--muted)}
  .title{
    font-size:clamp(28px,5vw,52px);font-weight:700;margin:8px 0 4px;
    background:linear-gradient(90deg,#9b7d2a,#f5d76e,#fff7d6,#f5d76e,#9b7d2a);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;animation:shimmer 6s linear infinite;
    text-shadow:0 0 40px rgba(212,175,55,.15)}
  @keyframes shimmer{to{background-position:200% center}}
  .subtitle{color:var(--muted);font-style:italic;font-size:15px}
  .birth-line{margin-top:12px;font-size:13px;color:var(--gold-soft);letter-spacing:.08em}
  .birth-line span{color:var(--muted)}

  /* ----- tabs ----- */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 22px}
  .tab{
    cursor:pointer;border:1px solid var(--line);background:rgba(26,11,46,.55);
    color:var(--muted);padding:9px 16px;border-radius:999px;font-size:13px;letter-spacing:.06em;
    transition:.25s;backdrop-filter:blur(6px)}
  .tab:hover{color:var(--gold-soft);border-color:var(--gold)}
  .tab.active{color:#1a0b2e;background:linear-gradient(90deg,#d4af37,#f5d76e);border-color:var(--gold-soft);
    box-shadow:0 0 22px rgba(212,175,55,.4);font-weight:700}

  /* ----- cards / panels ----- */
  .panel{animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{
    background:linear-gradient(160deg,rgba(45,27,78,.5),rgba(11,16,38,.6));
    border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin:14px 0;
    box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
  .card h2{font-size:22px;color:var(--gold-soft);margin-bottom:6px;letter-spacing:.02em}
  .card h3{font-size:16px;color:var(--gold);margin:18px 0 6px;letter-spacing:.04em}
  .card p{color:var(--ink);line-height:1.75;margin:8px 0;font-size:15px}
  .card p.small{color:var(--muted);font-size:13.5px}
  .lead{font-size:16.5px;color:#f3eeff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}

  .pill{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold-soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}

  .truth{border-left:3px solid #e0566b;padding-left:14px;margin:10px 0}
  .truth b{color:#ff9aa8}
  .strength{border-left:3px solid #5ad19a;padding-left:14px;margin:10px 0}
  .strength b{color:#86e8bd}

  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(212,175,55,.14)}
  th{color:var(--gold-soft);font-weight:700;letter-spacing:.05em}
  td{color:var(--ink)}
  td .conf{font-size:11px;color:var(--muted)}

  /* ----- chart ----- */
  .chart-stage{position:relative;display:flex;justify-content:center;align-items:center;padding:10px}
  .mandala{position:absolute;width:430px;height:430px;opacity:.16;animation:spin 90s linear infinite}
  .mandala.rev{animation:spin 140s linear infinite reverse;width:520px;height:520px;opacity:.08}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ni-chart{position:relative;filter:drop-shadow(0 0 26px rgba(212,175,55,.18))}
  .house-num{fill:var(--gold);font-size:11px;font-family:Georgia,serif;opacity:.8}
  .sign-name{fill:var(--muted);font-size:9px}
  .planet{fill:var(--gold-soft);font-size:13px;font-weight:bold;font-family:Georgia,serif}
  .planet.asc{fill:#ff9aa8}
  .grid-line{stroke:var(--gold);stroke-width:1.4;opacity:.55}
  .grid-frame{stroke:var(--gold-soft);stroke-width:2.2;fill:rgba(20,11,40,.35)}

  .legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
  .legend span{font-size:11.5px;color:var(--muted)}
  .legend b{color:var(--gold-soft)}

  /* ----- timeline ----- */
  .month{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(212,175,55,.12)}
  .month:last-child{border-bottom:none}
  .moncol{flex:0 0 110px}
  .moncol .m{color:var(--gold-soft);font-weight:700;font-size:15px}
  .moncol .d{color:var(--muted);font-size:11px;letter-spacing:.08em}
  .moncol .rating{margin-top:6px;font-size:11px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .g{background:#5ad19a}.y{background:#f5d76e}.r{background:#e0566b}.b{background:#7aa7ff}
  .moncon p{margin:3px 0;font-size:14px;line-height:1.65}
  .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);
    border-radius:6px;padding:2px 7px;margin-right:6px}

  .note{font-size:12.5px;color:var(--muted);line-height:1.7;background:rgba(11,16,38,.5);
    border:1px dashed rgba(212,175,55,.3);border-radius:14px;padding:14px 16px;margin:18px 0}
  .note b{color:var(--gold-soft)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;line-height:1.8}
  .om{font-size:22px;color:var(--gold);animation:pulse 4s ease-in-out infinite;display:inline-block}
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
  .mantra{font-size:15px;color:var(--gold-soft);letter-spacing:.04em}
</style>

<script>
/* build a twinkling starfield + occasional shooting stars (vanilla, behind React) */
(function(){
  const sky=document.getElementById('sky');
  for(let i=0;i<90;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2.2+0.6;
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
    s.style.animationDuration=(Math.random()*3+2)+'s';
    s.style.animationDelay=(Math.random()*4)+'s';
    sky.appendChild(s);
  }
  for(let i=0;i<3;i++){
    const sh=document.createElement('div');sh.className='shoot';
    sh.style.left=(Math.random()*60)+'%';sh.style.top=(Math.random()*40)+'%';
    sh.style.animationDuration=(Math.random()*6+7)+'s';
    sh.style.animationDelay=(Math.random()*8)+'s';
    sky.appendChild(sh);
  }
})();
</script>

function NorthIndianChart(){
  const lines=[
    "M0,0 L300,0 L300,300 L0,300 Z",       // outer square
